name: Build TorrentBox APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare TorrentBox
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"Не найден ожидаемый текст в {path}: {old}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          replace(
              "app/src/release/res/values/app_name.xml",
              "LibreTorrent",
              "TorrentBox"
          )

          replace(
              "app/src/debug/res/values/app_name.xml",
              "LibreTorrent - Debug",
              "TorrentBox"
          )

          replace(
              "app/src/main/java/org/proninyaroslav/libretorrent/core/settings/SettingsRepositoryImpl.java",
              "static final PrefTheme theme = new PrefTheme.System();",
              "static final PrefTheme theme = new PrefTheme.Dark();"
          )

          replace(
              "app/src/main/java/org/proninyaroslav/libretorrent/core/settings/SettingsRepositoryImpl.java",
              'static final String locale = "system";',
              'static final String locale = "ru";'
          )

          replace(
              "app/src/debug/res/values/ic_launcher_background.xml",
              "#5CCA4A",
              "#80D5E7"
          )

          replace(
              "app/src/release/res/values/ic_launcher_background.xml",
              "#9C27B0",
              "#123B5D"
          )

          print("Настройки TorrentBox подготовлены")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TorrentBox
        run: |
          chmod +x gradlew
          ./gradlew assembleBaseDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TorrentBox-Final-APK
          path: app/build/outputs/apk/base/debug/*.apk
